name: YePly
options:
  bundleIdPrefix: com.yeply
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.54.1
targets:
  YePly:
    type: application
    platform: iOS
    sources: [YePly]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeply.app
        MARKETING_VERSION: 2.5.0
        CURRENT_PROJECT_VERSION: 16
        INFOPLIST_FILE: YePly/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: YePly/Support/YePly.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: YePly/Support/Info.plist
