name: Build YePly IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project YePly.xcodeproj -scheme YePly

      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project YePly.xcodeproj \
            -scheme YePly \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            clean build | tee build.log

      - name: Package IPA
        run: |
          APP='build/Build/Products/Release-iphoneos/YePly.app'
          test -d "$APP"
          mkdir -p package/Payload
          ditto "$APP" package/Payload/YePly.app
          cd package
          /usr/bin/zip -qry ../YePly-2.0.0-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: YePly-IPA
          path: YePly-2.0.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: YePly-build-log
          path: build.log
          if-no-files-found: ignore
